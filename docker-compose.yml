services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: oa
      POSTGRES_PASSWORD: oa
      POSTGRES_DB: oa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://oa:oa@db:5432/oa
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
